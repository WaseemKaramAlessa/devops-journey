<style>

.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.g .card{margin:0}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.bar{height:8px;background:var(--pn2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}

dialog{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:10px;width:min(500px,94vw)}dialog::backdrop{background:#0008}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mu)}dialog input,dialog select,dialog textarea{width:100%}

.kb{display:flex;gap:10px;overflow-x:auto}.kb>div{min-width:190px}.kb .card{padding:8px;margin-bottom:8px;cursor:pointer}
.done{text-decoration:line-through;opacity:.6}#toast{position:fixed;bottom:16px;right:16px;background:var(--ac);color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9}

</style></head><body>

const applied=j=>!['Saved','To apply'].includes(j.status),m=(...s)=>!v.q||s.join(' ').toLowerCase().includes(v.q.toLowerCase()),qb=()=>`<input data-ch=q placeholder=Search value="${esc(v.q)}" aria-label=Search>`;

const V={
home(){const js=jstats(),tt=S.tasks.filter(t=>t.date==today()),dn=tt.filter(t=>t.status=='done').length,ph=curPh(),w=wk(),wm=w.reduce((a,d)=>a+dayMin(d),0),wp=w.reduce((a,d)=>a+plan(d),0),od=S.tasks.filter(t=>t.date<today()&&t.status=='todo').length,

<div class=g><div class=card><div class=mu>Phase ${ph+1}</div><b>${PH[ph][0]}</b><div class=bar><i style="width:${phPct(ph)}%"></i></div><div class=mu>Overall ${allPct()}% mastered</div></div>
